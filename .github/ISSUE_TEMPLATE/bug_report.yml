name: Bug report
description: 不具合を報告する
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Audio-Bridge version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: DAW／ホストとWindows
      placeholder: 例：REAPER 7.x / Windows 11 24H2
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: 使用した経路
      placeholder: 例：DAW input -> WASAPI shared output
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順と実際の結果
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する結果
    validations:
      required: true
