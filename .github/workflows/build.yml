name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --target audio_bridge --parallel

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Audio-Bridge-windows-x64
          path: |
            build/VST3/Release/Audio-Bridge.vst3
            LICENSE
            THIRD_PARTY_NOTICES.md
          if-no-files-found: error
